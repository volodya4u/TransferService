name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      # The shared core library (volodya4u/core) is not published to a Maven
      # repository, so build it and install it into the local one first.
      - name: Check out core library
        uses: actions/checkout@v7
        with:
          repository: volodya4u/core
          path: .core

      - name: Install core library
        run: mvn -B -ntp install -DskipTests -f .core/pom.xml

      - name: Build and test
        run: mvn -B -ntp verify

  # Merge Dependabot's patch and minor updates once build-and-test has passed.
  # Docker image updates and minor Spring Boot parent updates are left for review.
  dependabot-auto-merge:
    needs: build-and-test
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v3

      - name: Merge patch and minor updates
        if: >-
          steps.meta.outputs.package-ecosystem != 'docker' &&
          (steps.meta.outputs.update-type == 'version-update:semver-patch' ||
           (steps.meta.outputs.update-type == 'version-update:semver-minor' &&
            !contains(steps.meta.outputs.dependency-names, 'spring-boot-starter-parent')))
        run: gh pr merge --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
