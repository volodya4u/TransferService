name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      # The shared core library (volodya4u/core) is not published to a Maven
      # repository, so build it and install it into the local one first.
      - name: Check out core library
        uses: actions/checkout@v7
        with:
          repository: volodya4u/core
          path: .core

      - name: Install core library
        run: mvn -B -ntp install -DskipTests -f .core/pom.xml

      - name: Build and test
        run: mvn -B -ntp verify

  # Runs the packaged service against a real Kafka broker. A transfer must
  # commit a withdrawal and a deposit event; when the remote service is down,
  # the transfer must fail and its events must never become visible to
  # read_committed consumers.
  smoke-test:
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      kafka:
        image: apache/kafka:4.2.1
        ports:
          - 9092:9092
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Check out core library
        uses: actions/checkout@v7
        with:
          repository: volodya4u/core
          path: .core

      - name: Install core library
        run: mvn -B -ntp install -DskipTests -f .core/pom.xml

      - name: Package
        run: mvn -B -ntp package -DskipTests

      # Stands in for the remote service the transfer calls at
      # http://localhost:8082/response/200.
      - name: Start stub remote service
        run: |
          mkdir -p stub/response
          echo '{"status":"ok"}' > stub/response/200
          nohup python3 -u -m http.server 8082 --directory stub > stub.log 2>&1 &
          echo $! > stub.pid
          timeout 30 bash -c 'until curl -sf -o /dev/null http://localhost:8082/; do sleep 1; done'

      # A single broker, so the topics get one replica.
      - name: Start service
        run: |
          nohup java -jar target/*.jar --server.port=8080 --app.kafka.topic.replicas=1 \
            > service.log 2>&1 &
          timeout 120 bash -c 'until grep -q "Started PaymentsApplication" service.log; do sleep 2; done'

      - name: Make a transfer
        run: |
          result=$(curl -sS --fail-with-body -H 'Content-Type: application/json' \
            -d '{"senderId":"smoke-sender","recepientId":"smoke-recipient","amount":42.5}' \
            http://localhost:8080/transfers)
          echo "Transfer result: $result"
          test "$result" = true

      - name: Check that the service created the topics
        run: |
          for topic in withdraw-money-topic deposit-money-topic; do
            docker exec ${{ job.services.kafka.id }} /opt/kafka/bin/kafka-topics.sh \
              --bootstrap-server localhost:9092 --describe --topic "$topic" | tee topic.txt
            grep -q "PartitionCount: 3" topic.txt
          done

      - name: Check the committed events
        run: |
          docker exec ${{ job.services.kafka.id }} /opt/kafka/bin/kafka-console-consumer.sh \
            --bootstrap-server localhost:9092 --include 'withdraw-money-topic|deposit-money-topic' \
            --isolation-level read_committed --from-beginning --max-messages 2 --timeout-ms 30000 \
            --formatter-property print.headers=true | tee events.txt
          grep -q '__TypeId__:com.appsdeveloperblog.ws.core.events.WithdrawalRequestedEvent.*"amount":42.5' events.txt
          grep -q '__TypeId__:com.appsdeveloperblog.ws.core.events.DepositRequestedEvent.*"amount":42.5' events.txt

      - name: Check that a failed transfer is rolled back
        run: |
          kill "$(cat stub.pid)"
          status=$(curl -sS -o response.txt -w '%{http_code}' -H 'Content-Type: application/json' \
            -d '{"senderId":"smoke-sender","recepientId":"smoke-recipient","amount":13}' \
            http://localhost:8080/transfers)
          echo "Transfer with the remote service down: HTTP $status"
          test "$status" = 500
          docker exec ${{ job.services.kafka.id }} /opt/kafka/bin/kafka-console-consumer.sh \
            --bootstrap-server localhost:9092 --include 'withdraw-money-topic|deposit-money-topic' \
            --isolation-level read_committed --from-beginning --max-messages 3 --timeout-ms 10000 \
            | tee committed.txt || true
          test "$(grep -c amount committed.txt)" -eq 2
          if grep -q '"amount":13' committed.txt; then
            echo "The failed transfer's events were committed"
            exit 1
          fi

      - name: Show service log
        if: always()
        run: cat service.log || true

  # Merge Dependabot's patch and minor updates once build-and-test and the Kafka
  # smoke test have passed. Docker image updates and minor Spring Boot parent
  # updates are left for review.
  dependabot-auto-merge:
    needs: [build-and-test, smoke-test]
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v3

      - name: Merge patch and minor updates
        if: >-
          steps.meta.outputs.package-ecosystem != 'docker' &&
          (steps.meta.outputs.update-type == 'version-update:semver-patch' ||
           (steps.meta.outputs.update-type == 'version-update:semver-minor' &&
            !contains(steps.meta.outputs.dependency-names, 'spring-boot-starter-parent')))
        run: gh pr merge --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
