name: Dependabot auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v3

      # Patch and minor updates merge once the required build-and-test check
      # passes; major updates stay open for review. The Spring Boot parent
      # moves every Spring library at once, so only its patch updates merge
      # automatically. Docker image updates are left for review because CI
      # doesn't build the image.
      - name: Enable auto-merge
        if: >-
          steps.meta.outputs.package-ecosystem != 'docker' &&
          (steps.meta.outputs.update-type == 'version-update:semver-patch' ||
           (steps.meta.outputs.update-type == 'version-update:semver-minor' &&
            !contains(steps.meta.outputs.dependency-names, 'spring-boot-starter-parent')))
        run: gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
